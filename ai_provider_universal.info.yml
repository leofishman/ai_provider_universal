name: "AI Provider: Universal"
type: module
description: "Universal multi-instance AI provider. Servers and models as config entities, dynamic operation-type detection, per-model capability overrides. Ships ten OpenAI-compatible backends (Ollama, Groq, OpenRouter, Fireworks, llama.cpp/vLLM, …); other protocols via backend plugins."
core_version_requirement: ^11.1 || ^12
package: AI Providers
dependencies:
  - ai:ai
  - key:key
configure: entity.ai_universal_server.collection
'interface translation project': ai_provider_universal
'interface translation server pattern': 'modules/contrib/ai_provider_universal/translations/%project.%language.po'
