services:
  Drupal\ai_provider_universal\Hook\AiProviderUniversalHooks:
    class: Drupal\ai_provider_universal\Hook\AiProviderUniversalHooks
    autowire: true
    arguments:
      $aiProviderManager: '@ai.provider'

  Drupal\ai_provider_universal\Backend\AiServerBackendManager:
    class: Drupal\ai_provider_universal\Backend\AiServerBackendManager
    parent: default_plugin_manager

  plugin.manager.ai_provider_universal.server_backend:
    alias: Drupal\ai_provider_universal\Backend\AiServerBackendManager

  Drupal\ai_provider_universal\Service\UsageTracker:
    class: Drupal\ai_provider_universal\Service\UsageTracker
    arguments:
      - '@database'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@logger.factory'

  Drupal\ai_provider_universal\Service\ModelCatalog:
    class: Drupal\ai_provider_universal\Service\ModelCatalog
    autowire: true
    arguments:
      $transliteration: '@transliteration'

  Drupal\ai_provider_universal\EventSubscriber\GuardrailDefaultsSubscriber:
    class: Drupal\ai_provider_universal\EventSubscriber\GuardrailDefaultsSubscriber
    autowire: true
    tags:
      - { name: event_subscriber }

  Drupal\ai_provider_universal\Service\ProvenanceRecorder:
    class: Drupal\ai_provider_universal\Service\ProvenanceRecorder
    autowire: true
    tags:
      - { name: event_subscriber }

  # Stable alias for workflows/ECA code asserting AI origin on entities.
  ai_provider_universal.provenance:
    alias: Drupal\ai_provider_universal\Service\ProvenanceRecorder
