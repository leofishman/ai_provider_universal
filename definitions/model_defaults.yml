# Defaults applied at discovery when the backend detects nothing. Values
# only fill fields that are still unset — they never overwrite a manual
# edit, and every model remains overridable in the UI.
#
# DO NOT edit this file for site-specific entries: it is replaced on
# module updates. Put your entries in an override file (same format,
# entries win over these) and declare it in settings.php:
#   $settings['ai_provider_universal_model_defaults'] = 'sites/default/model_defaults.yml';
#
# All keys are case-insensitive regexes matched against the raw model id;
# first match wins.

quality_tiers:
  # Tier 1 Minimal - 5 Frontier.
  families:
    # Frontier (5).
    'gpt-5': 5
    'claude-(opus|fable)': 5
    '\bo[13](-|$|\b)': 5
    'gemini-\d+(\.\d+)?-pro': 5
    'deepseek-r\d': 5
    'grok-[3-9]': 5
    # Strong (4).
    'claude-sonnet': 4
    'gpt-4': 4
    'deepseek-v\d': 4
    'mistral-large': 4
    'qwen\d*[.-]?\d*-max': 4
    # Solid (3).
    'claude-haiku': 3
    'gemini-\d+(\.\d+)?-flash': 3
    'mixtral': 3
    'mistral-(small|medium)': 3
    # Minimal (1).
    'smollm|tinyllama': 1
  # Fallback by parameter count parsed from the id (8b, 70b, 0.5b...).
  # Minimum size in billions => tier; highest threshold met wins.
  sizes:
    200: 4
    27: 3
    7: 2
    0: 1
  # Last-resort fallback by price band, for live-pricing catalogs
  # (OpenRouter, Groq, ...) whose ids match no family or size pattern.
  # Minimum cost_output in USD per 1M tokens => tier; highest met wins.
  # Rough but useful across 300+ models; rate any model you care about.
  prices:
    '20': 5
    '5': 4
    '0.5': 3
    '0.1': 2
    '0': 1

# Costs in USD per 1 million tokens, applied when the backend publishes no
# pricing (plain openai_compatible servers, ollama_cloud, grok without a
# matching table row, ...). Live-catalog backends (openrouter, groq,
# litellm, huggingface) and free local ollama usually set costs themselves.
# Backends
# that know their prices win over this map (openrouter/litellm read them
# live; fireworks ships its own table in Fireworks.php). Shipped empty on
# purpose: list prices go stale and silently skew smart-routing cost
# comparisons — maintain your own entries (in the override file, see
# above) and verify them against your provider's pricing page.
#
# Examples:
# costs:
#   'gpt-4o-mini': { input: 0.15, output: 0.60 }
#   'llama3.*70b': { input: 0.90, output: 0.90 }
#   'my-local-.*': { input: 0, output: 0 }
costs: {}

# Vendor-documented sampling recommendations, applied at discovery when the
# model entity has no sampling overrides yet. Same regex matching as above;
# first match wins. Only families whose vendor publishes explicit
# recommendations are listed — everything else stays on the server default.
# Sources: Qwen3 and DeepSeek-R1 model cards (both recommend 0.6/0.95 and
# warn against greedy decoding for thinking modes); gpt-oss OpenAI docs
# (temperature 1.0, top_p 1.0).
sampling:
  'qwen3': { temperature: 0.6, top_p: 0.95 }
  'deepseek-r\d': { temperature: 0.6, top_p: 0.95 }
  'gpt-oss': { temperature: 1.0, top_p: 1.0 }
