services:
  Drupal\ai_provider_universal_factcheck\Service\EvidenceRetriever:
    class: Drupal\ai_provider_universal_factcheck\Service\EvidenceRetriever
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@module_handler'
      - '@http_client'
      - '@key.repository'
      - '@Drupal\ai_provider_universal_factcheck\Service\TrustedSiteRepository'
      - '@logger.channel.ai_provider_universal_factcheck'

  Drupal\ai_provider_universal_factcheck\Service\TrustedSiteRepository:
    class: Drupal\ai_provider_universal_factcheck\Service\TrustedSiteRepository
    arguments:
      - '@entity_type.manager'

  Drupal\ai_provider_universal_factcheck\Service\FactChecker:
    class: Drupal\ai_provider_universal_factcheck\Service\FactChecker
    arguments:
      - '@ai.provider'
      - '@config.factory'
      - '@Drupal\ai_provider_universal_factcheck\Service\EvidenceRetriever'
      - '@logger.channel.ai_provider_universal_factcheck'

  # Stable alias consumed by the provider (no hard class dependency).
  ai_provider_universal_factcheck.checker:
    alias: Drupal\ai_provider_universal_factcheck\Service\FactChecker

  logger.channel.ai_provider_universal_factcheck:
    parent: logger.channel_base
    arguments: ['ai_provider_universal_factcheck']

  Drupal\ai_provider_universal_factcheck\Service\ReadabilityScorer:
    class: Drupal\ai_provider_universal_factcheck\Service\ReadabilityScorer

  Drupal\ai_provider_universal_factcheck\Service\AiDetector:
    class: Drupal\ai_provider_universal_factcheck\Service\AiDetector
    arguments:
      - '@ai.provider'
      - '@config.factory'
      - '@logger.channel.ai_provider_universal_factcheck'

  Drupal\ai_provider_universal_factcheck\Service\PlagiarismChecker:
    class: Drupal\ai_provider_universal_factcheck\Service\PlagiarismChecker
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@key.repository'
      - '@logger.channel.ai_provider_universal_factcheck'
