name: 'AI Provider: Universal — Fact Check'
type: module
description: 'Verifies routed answers claim by claim (optionally against an ai_search index) and escalates to a stronger model when verification fails.'
core_version_requirement: ^11.1 || ^12
package: AI Providers
dependencies:
  - ai_provider_universal:ai_provider_universal
  - ai_provider_universal:ai_provider_universal_router
  - drupal:node
configure: ai_provider_universal_factcheck.settings
'interface translation project': ai_provider_universal_factcheck
'interface translation server pattern': 'modules/contrib/ai_provider_universal/modules/ai_provider_universal_factcheck/translations/%project.%language.po'
