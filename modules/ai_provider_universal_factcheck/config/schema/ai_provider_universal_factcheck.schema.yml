ai_provider_universal_factcheck.settings:
  type: config_object
  label: 'Fact check settings'
  mapping:
    profile:
      type: string
      label: 'Verification profile: fast | balanced | thorough'
    checker_model:
      type: string
      label: 'Checker model (ai_universal_model id)'
    extractor_model:
      type: string
      label: 'Claim extractor model (ai_universal_model id, empty = checker model)'
    evidence_index:
      type: string
      label: 'Search API index for evidence (optional)'
    max_claims:
      type: integer
      label: 'Maximum claims to verify per answer'
    detector_model:
      type: string
      label: 'AI-detection model (ai_universal_model id, empty = checker model)'
    plagiarism_key:
      type: string
      label: 'Key entity holding the Serper.dev API key (empty = plagiarism check disabled)'
    tavily_key:
      type: string
      label: 'Key entity holding the Tavily API key (empty = no web evidence fallback)'
    mbfc_key:
      type: string
      label: 'Key entity holding the MediaBiasFactCheck RapidAPI key (empty = static JSON import only)'
    notify_email:
      type: email
      label: 'Admin email alerted on scans and settings changes (empty = disabled)'
    scan_flood_limits:
      type: sequence
      label: 'Max content scans per session within the flood window, keyed by role ID (0 or unset = unlimited)'
      sequence:
        type: integer
        label: 'Limit'
    scan_flood_window:
      type: integer
      label: 'Flood window in seconds'
    prompts:
      type: mapping
      label: 'Prompt template overrides (empty = shipped default; sprintf placeholders must be kept)'
      mapping:
        extract:
          type: text
          label: 'Claim extraction prompt (%d max claims, %s text)'
        verify:
          type: text
          label: 'Per-claim verdict prompt (%s evidence, %s suffix, %s claim)'
        batch_verify:
          type: text
          label: 'Batched verdict prompt (%s suffix, %s claim blocks)'
        taint:
          type: text
          label: 'Distrusted-echo prompt (%s claims, %s evidence)'
        analyze:
          type: text
          label: 'Discrepancy analysis prompt (%s claim, %s evidence)'
        detect:
          type: text
          label: 'AI-likelihood detector prompt (%s text)'

ai_provider_universal_factcheck.scan_profile.*:
  type: config_entity
  label: 'Scan profile'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    bundles:
      type: sequence
      label: 'Node bundles to scan'
      sequence:
        type: string
        label: 'Bundle'
    operations:
      type: sequence
      label: 'Operations that enqueue (insert, update)'
      sequence:
        type: string
        label: 'Operation'
    published_only:
      type: boolean
      label: 'Scan published nodes only'
    cooldown:
      type: integer
      label: 'Seconds before the same node can be enqueued again'
    checks:
      type: mapping
      label: 'Check settings (missing check = disabled)'
      mapping:
        readability:
          type: mapping
          label: 'Readability (free, local)'
          mapping:
            enabled:
              type: boolean
              label: 'Enabled'
            alert_below:
              type: integer
              label: 'Alert below this Flesch reading ease score'
        ai_likelihood:
          type: mapping
          label: 'AI likelihood (one LLM call)'
          mapping:
            enabled:
              type: boolean
              label: 'Enabled'
            alert_threshold:
              type: integer
              label: 'Alert at or above this likelihood (0-100)'
        factcheck:
          type: mapping
          label: 'Fact check (claim extraction + verification)'
          mapping:
            enabled:
              type: boolean
              label: 'Enabled'
            alert_below:
              type: float
              label: 'Alert below this support score (0-1)'
        plagiarism:
          type: mapping
          label: 'Plagiarism (external search API)'
          mapping:
            enabled:
              type: boolean
              label: 'Enabled'
            alert_min_hits:
              type: integer
              label: 'Alert at or above this many verbatim matches'
    event_on:
      type: string
      label: 'Dispatch the content review event: always | threshold | never'
