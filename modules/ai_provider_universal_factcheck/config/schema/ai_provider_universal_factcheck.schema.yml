ai_provider_universal_factcheck.settings:
  type: config_object
  label: 'Fact check settings'
  mapping:
    profile:
      type: string
      label: 'Verification profile: fast | balanced | thorough'
    checker_model:
      type: string
      label: 'Checker model (ai_universal_model id)'
    extractor_model:
      type: string
      label: 'Claim extractor model (ai_universal_model id, empty = checker model)'
    evidence_index:
      type: string
      label: 'Search API index for evidence (optional)'
    max_claims:
      type: integer
      label: 'Maximum claims to verify per answer'
    detector_model:
      type: string
      label: 'AI-detection model (ai_universal_model id, empty = checker model)'
    plagiarism_key:
      type: string
      label: 'Key entity holding the Serper.dev API key (empty = plagiarism check disabled)'
    tavily_key:
      type: string
      label: 'Key entity holding the Tavily API key (empty = no web evidence fallback)'
