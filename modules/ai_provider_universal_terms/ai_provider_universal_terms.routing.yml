ai_provider_universal_terms.analyze:
  path: '/api/terms/analyze'
  defaults:
    _controller: '\Drupal\ai_provider_universal_terms\Controller\TermsController::analyze'
  methods: [POST]
  requirements:
    _permission: 'use terms analyzer'
    _format: json
    # A JSON body only: a cross-site form cannot send one without a CORS
    # preflight.
    _content_type_format: json
    # Cookie-authenticated callers must send X-CSRF-Token (from
    # /session/token); other authentication is not affected.
    _csrf_request_header_token: 'TRUE'

ai_provider_universal_terms.settings:
  path: '/admin/config/ai/terms'
  defaults:
    _form: '\Drupal\ai_provider_universal_terms\Form\TermsSettingsForm'
    _title: 'Terms analyzer'
  requirements:
    _permission: 'administer ai providers'
