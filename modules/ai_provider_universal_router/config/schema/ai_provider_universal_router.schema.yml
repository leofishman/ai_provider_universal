ai_provider_universal_router.settings:
  type: config_object
  label: 'Smart routing settings'
  mapping:
    classifier_model:
      type: string
      label: 'Model entity id used to classify prompt complexity (empty = heuristics)'

ai_provider_universal_router.route.*:
  type: config_entity
  label: 'Smart Route'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    operation_type:
      type: string
      label: 'Operation Type'
    candidates:
      type: sequence
      label: 'Candidate model IDs'
      sequence:
        type: string
        label: 'Model ID'
    simple_tier:
      type: integer
      label: 'Minimum tier for simple prompts'
    complex_tier:
      type: integer
      label: 'Minimum tier for complex prompts'
    factcheck:
      type: boolean
      label: 'Fact-check answers'
    factcheck_min_score:
      type: float
      label: 'Minimum support score before escalation'
