ai_provider_universal.server.*:
  type: config_entity
  label: 'AI Server'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    backend:
      type: string
      label: 'Backend plugin ID'
    host_name:
      type: string
      label: 'Host Name'
    port:
      type: string
      label: 'Port'
    api_key:
      type: string
      label: 'API Key (Key entity ID)'
    timeout:
      type: integer
      label: 'Timeout'
    operation_types:
      type: sequence
      label: 'Operation Types'
      sequence:
        type: string
        label: 'Operation Type'
    model_filter:
      type: string
      label: 'Model Filter'

ai_provider_universal.model.*:
  type: config_entity
  label: 'AI Model'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    server_id:
      type: string
      label: 'Server ID'
    raw_model_id:
      type: string
      label: 'Raw Model ID'
    detected_operation_types:
      type: sequence
      label: 'Detected Operation Types'
      sequence:
        type: string
        label: 'Operation Type'
    operation_types:
      type: sequence
      label: 'Operation Types (overrides)'
      sequence:
        type: string
        label: 'Operation Type'
    cost_input:
      type: float
      label: 'Cost per million input tokens (USD)'
      nullable: true
    cost_output:
      type: float
      label: 'Cost per million output tokens (USD)'
      nullable: true
    quality_tier:
      type: integer
      label: 'Quality tier (1-5)'
      nullable: true
    context_length:
      type: integer
      label: 'Context length (tokens)'
      nullable: true
    reasoning:
      type: string
      label: 'Reasoning effort (none/low/medium/high, empty = server default)'
      nullable: true
