ai_provider_universal.server.*:
  type: config_entity
  label: 'AI Server'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    backend:
      type: string
      label: 'Backend plugin ID'
    host_name:
      type: string
      label: 'Host Name'
    port:
      type: string
      label: 'Port'
    api_key:
      type: string
      label: 'API Key (Key entity ID)'
    timeout:
      type: integer
      label: 'Timeout'
    operation_types:
      type: sequence
      label: 'Operation Types'
      sequence:
        type: string
        label: 'Operation Type'
    model_filter:
      type: string
      label: 'Model Filter'
    daily_request_limit:
      type: integer
      label: 'Maximum requests per day across all models (empty = unlimited)'
      nullable: true
    daily_token_limit:
      type: integer
      label: 'Maximum tokens (input + output) per day across all models (empty = unlimited)'
      nullable: true
    alert_threshold:
      type: integer
      label: 'Usage percentage that triggers an alert event/log (empty = no alert)'
      nullable: true
    limit_grace:
      type: integer
      label: 'Percentage the server may exceed its limits before blocking (empty/0 = none)'
      nullable: true

ai_provider_universal.model.*:
  type: config_entity
  label: 'AI Model'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    server_id:
      type: string
      label: 'Server ID'
    raw_model_id:
      type: string
      label: 'Raw Model ID'
    detected_operation_types:
      type: sequence
      label: 'Detected Operation Types'
      sequence:
        type: string
        label: 'Operation Type'
    operation_types:
      type: sequence
      label: 'Operation Types (overrides)'
      sequence:
        type: string
        label: 'Operation Type'
    cost_input:
      type: float
      label: 'Cost per million input tokens (USD)'
      nullable: true
    cost_output:
      type: float
      label: 'Cost per million output tokens (USD)'
      nullable: true
    quality_tier:
      type: integer
      label: 'Quality tier (1-5)'
      nullable: true
    context_length:
      type: integer
      label: 'Context length (tokens)'
      nullable: true
    reasoning:
      type: string
      label: 'Reasoning effort (none/low/medium/high, empty = server default)'
      nullable: true
    supported_features:
      type: sequence
      label: 'Supported features from the server catalog (tools, reasoning, json_mode, ...)'
      sequence:
        type: string
        label: 'Feature'
    sampling:
      type: mapping
      label: 'Sampling overrides sent on chat requests (absent key = server default)'
      mapping:
        temperature:
          type: float
          label: 'Temperature'
        top_p:
          type: float
          label: 'Top P'
        frequency_penalty:
          type: float
          label: 'Frequency penalty'
        presence_penalty:
          type: float
          label: 'Presence penalty'
